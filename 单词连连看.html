<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六级单词连连看 - 手机版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 顶部面板固定在顶端 */
        #top-panel {
            padding: 10px;
            background-color: #1e1e24;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            z-index: 10;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .info-group { display: flex; gap: 10px; flex-wrap: wrap; }
        #level-label { color: #f1c40f; }
        #score-label { color: #fff; }
        #high-score-label { color: #e67e22; }
        #time-label { color: #e74c3c; }
        
        /* 提示语 */
        #prompt-label {
            width: 100%;
            text-align: center;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 5px;
        }

        #restart-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 游戏区域：允许上下滚动 */
        #game-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #game-board {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 600px; /* 电脑端也不会太宽 */
            align-content: start;
        }

        /* 卡片 */
        .card {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.1s, box-shadow 0.1s;
            aspect-ratio: 1 / 1; /* 强制卡片为正方形 */
            width: 100%;
            overflow-wrap: break-word;
            word-break: break-all;
            line-height: 1.1;
        }
        .card:active { transform: scale(0.95); }
        .card.selected {
            box-shadow: 0 0 0 3px #fff inset;
            transform: scale(0.95);
        }
        .card.cleared {
            visibility: hidden;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="top-panel">
        <div class="info-row">
            <div class="info-group">
                <span id="level-label">第 1 关</span>
                <span id="score-label">总分: 0</span>
                <span id="high-score-label">历史最高: 0</span>
            </div>
            <div class="info-group">
                <span id="time-label">剩余时间: 0s</span>
                <button id="restart-btn" onclick="restartGame()">重头开始</button>
            </div>
        </div>
        <div id="prompt-label"></div>
    </div>

    <div id="game-wrapper">
        <div id="game-board"></div>
    </div>

    <script>
        // ==================== 词库（你可以直接在这里添加你的单词） ====================
        const VOCAB_POOL = [
            { en: "abandon", cn: "v. 放弃" },
            { en: "ability", cn: "n. 能力" },
            { en: "absorb", cn: "v. 吸收" },
            { en: "abstract", cn: "a. 抽象的\nn. 摘要" },
            { en: "academic", cn: "a. 学术的" },
            { en: "accelerate", cn: "v. 加速" },
            { en: "accept", cn: "v. 接受" },
            { en: "access", cn: "n. 接近\nv. 访问" },
            { en: "accommodate", cn: "v. 容纳" },
            { en: "accompany", cn: "v. 陪伴" },
            { en: "accumulate", cn: "v. 积累" },
            { en: "accurate", cn: "a. 准确的" },
            { en: "achieve", cn: "v. 实现" },
            { en: "acknowledge", cn: "v. 承认" },
            { en: "acquire", cn: "v. 获得" },
            { en: "adapt", cn: "v. 适应" },
            { en: "adequate", cn: "a. 充足的" },
            { en: "adjust", cn: "v. 调整" },
            { en: "administration", cn: "n. 管理" },
            { en: "admire", cn: "v. 钦佩" },
            { en: "adopt", cn: "v. 采纳" },
            { en: "advocate", cn: "v. 提倡" },
            { en: "affect", cn: "v. 影响" },
            { en: "alter", cn: "v. 改变" },
            { en: "alternative", cn: "n. 替代品" }
        ];

        const COLOR_POOL = [
            "#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#1abc9c", 
            "#3498db", "#9b59b6", "#fd79a8", "#00b894", "#0984e3",
            "#d63031", "#fdcb6e", "#00cec9", "#6c5ce7", "#e84393"
        ];

        const MAX_LEVEL = 5;

        let level = 1;
        let score = 0;
        let timeLeft = 0;
        let highScore = parseInt(localStorage.getItem('cet6_high_score')) || 0;
        let gameOver = false;
        let isWinAll = false;
        let firstSelected = null;
        let timerInterval = null;
        let currentCards = [];

        const board = document.getElementById('game-board');
        const levelLabel = document.getElementById('level-label');
        const scoreLabel = document.getElementById('score-label');
        const highScoreLabel = document.getElementById('high-score-label');
        const timeLabel = document.getElementById('time-label');
        const promptLabel = document.getElementById('prompt-label');

        highScoreLabel.innerText = `历史最高: ${highScore}`;
        restartGame();

        // 音效
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function getContrastColor(hex) {
            hex = hex.replace('#', '');
            let r = parseInt(hex.substr(0, 2), 16);
            let g = parseInt(hex.substr(2, 2), 16);
            let b = parseInt(hex.substr(4, 2), 16);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 150) ? '#1e1e24' : '#ffffff';
        }

        function restartGame() {
            level = 1;
            score = 0;
            startLevel();
        }

        function startLevel() {
            clearInterval(timerInterval);
            if (level > MAX_LEVEL) {
                gameOver = true;
                isWinAll = true;
                board.innerHTML = '<div style="grid-column: 1 / -1; color:#f1c40f; font-size:24px; font-weight:bold; text-align:center; padding: 50px;">🎉 恭喜你！全部通关！</div>';
                return;
            }

            const pairsCount = Math.pow(2, level);
            const totalCards = pairsCount * 2;
            timeLeft = pairsCount * 15;
            
            gameOver = false;
            isWinAll = false;
            firstSelected = null;
            updateInfo();

            // 【核心修复】手机端最大列数限制为 4，电脑端最多 6
            let maxCols = window.innerWidth < 600 ? 4 : 6;
            let cols = Math.ceil(Math.sqrt(totalCards));
            if (cols > maxCols) cols = maxCols;
            // 确保总数能被列数整除
            while (totalCards % cols !== 0) {
                cols--;
            }
            
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            // 移除固定行数限制，让卡片自适应正方形

            generateBoard(pairsCount);
            renderBoard();
            
            timerInterval = setInterval(() => {
                if (gameOver || isWinAll) return;
                timeLeft--;
                timeLabel.innerText = `剩余时间: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver = true;
                    board.innerHTML = `<div style="grid-column: 1 / -1; color:#e74c3c; font-size:24px; font-weight:bold; text-align:center; padding: 50px;">时间到！游戏结束<br><span style="color:#fff; font-size:16px;">得分: ${score}</span></div>`;
                }
            }, 1000);
        }

        function generateBoard(pairsCount) {
            let pool = [...VOCAB_POOL].sort(() => 0.5 - Math.random());
            while (pool.length < pairsCount) {
                pool = pool.concat([...VOCAB_POOL].sort(() => 0.5 - Math.random()));
            }
            
            currentCards = [];
            for (let i = 0; i < pairsCount; i++) {
                const word = pool[i];
                const pairId = `pair_${i}`;
                currentCards.push({ type: 'en', text: word.en, pairId, color: COLOR_POOL[Math.floor(Math.random()*COLOR_POOL.length)] });
                currentCards.push({ type: 'cn', text: word.cn, pairId, color: COLOR_POOL[Math.floor(Math.random()*COLOR_POOL.length)] });
            }
            
            currentCards.sort(() => 0.5 - Math.random());
        }

        function renderBoard() {
            board.innerHTML = '';
            currentCards.forEach((card, index) => {
                if (card.cleared) return;
                
                const div = document.createElement('div');
                div.className = 'card';
                if (firstSelected === index) div.classList.add('selected');
                
                div.dataset.index = index;
                div.style.backgroundColor = card.color;
                div.style.color = getContrastColor(card.color);
                
                // 【核心修复】更智能的文字大小
                if (card.type === 'en') {
                    // 长单词自适应缩小字体
                    let len = card.text.length;
                    if (len > 10) {
                        div.style.fontSize = '12px';
                    } else if (len > 7) {
                        div.style.fontSize = '14px';
                    } else {
                        div.style.fontSize = '16px';
                    }
                    div.style.fontWeight = 'bold';
                } else {
                    div.style.fontSize = '13px';
                    div.style.whiteSpace = 'pre-wrap'; // 支持中文里的换行
                }

                div.innerText = card.text;
                div.onclick = () => onCardClick(index);
                board.appendChild(div);
            });
        }

        function onCardClick(index) {
            if (gameOver || isWinAll || currentCards[index].cleared) return;

            if (firstSelected === null) {
                firstSelected = index;
                renderBoard();
                return;
            }

            if (firstSelected === index) {
                firstSelected = null;
                renderBoard();
                return;
            }

            const card1 = currentCards[firstSelected];
            const card2 = currentCards[index];

            if (card1.type === card2.type || card1.pairId !== card2.pairId) {
                score -= 3;
                firstSelected = null;
                updateInfo();
                renderBoard();
                return;
            }

            playSound();
            card1.cleared = true;
            card2.cleared = true;
            score += 5;
            firstSelected = null;
            updateInfo();
            renderBoard();

            if (currentCards.every(c => c.cleared)) {
                gameOver = true;
                clearInterval(timerInterval);
                board.innerHTML = `<div style="grid-column: 1 / -1; color:#2ecc71; font-size:24px; font-weight:bold; text-align:center; padding: 50px;">第 ${level} 关 通过！</div>`;
                setTimeout(() => {
                    level++;
                    startLevel();
                }, 2000);
            }
        }

        function updateInfo() {
            levelLabel.innerText = `第 ${level} 关 (2^${level}对)`;
            scoreLabel.innerText = `总分: ${score}`;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cet6_high_score', highScore);
                highScoreLabel.innerText = `历史最高: ${highScore}`;
                promptLabel.innerText = "goodo(￣▽￣)d，你太棒了";
                promptLabel.style.color = "#f1c40f";
            } else if (highScore > 0 && score >= highScore * 0.5) {
                promptLabel.innerText = "你即将打破历史最高记录";
                promptLabel.style.color = "#e74c3c";
            } else if (highScore > 0 && score >= highScore * (1/3)) {
                promptLabel.innerText = "加油";
                promptLabel.style.color = "#2ecc71";
            } else {
                promptLabel.innerText = "";
            }
        }
    </script>
</body>
</html>
