        /* 游戏区域 */

        #game-board { display: grid; gap: 8px; width: 100%; max-width: 600px; align-content: center; justify-content: center;}

        /* 卡片基础样式 */
        .card { 
            display: flex; justify-content: center; align-items: center; text-align: center; 
            border-radius: 10px; cursor: pointer; padding: 4px; 
            transition: transform 0.1s, box-shadow 0.1s; 
            aspect-ratio: 1 / 1; 
            width: 100%; 
            overflow-wrap: break-word; word-break: break-all; line-height: 1.15; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.95); }
        .card.selected { box-shadow: 0 0 0 4px #fff inset; transform: scale(0.95); }
        .card.cleared { visibility: hidden; pointer-events: none; }
        
        /* 选错时的抖动动画 */
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 50% { transform: translateX(5px) rotate(2deg); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .card.wrong { animation: shake 0.4s ease-in-out; background-color: #e74c3c !important; color: #fff !important; border: 2px solid #fff; }
        
        /* 英文卡片：冷色深色，强制白字 */
        .card-en { color: #ffffff !important; font-weight: bold; font-family: 'Arial', sans-serif; }
        /* 中文卡片：暖色浅色，强制黑字 */
        .card-cn { color: #000000 !important; font-weight: bold; }

        /* 弹窗遮罩通用样式 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(30,30,36,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        /* 开始菜单 */

        .menu-desc { font-size: 14px; color: #aaa; margin-bottom: 30px; text-align: center; line-height: 1.6; }
        .menu-btn { width: 80%; max-width: 300px; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; }
        .menu-btn:active { transform: scale(0.95); }

        .btn-hard { background-color: #e67e22; }
        .btn-hell { background-color: #e74c3c; }
        .btn-primary { background-color: #3498db; }
        .btn-secondary { background-color: #7f8c8d; }

        const COLORS_EN = ["#2980b9", "#34495e", "#8e44ad", "#16a085", "#2c3e50", "#1e3799"];
        const COLORS_CN = ["#f1c40f", "#e67e22", "#f39c12", "#d35400", "#f8c291", "#f6e58d"];

        const LEVEL_PAIRS = [4, 6, 8, 10, 12]; 
        
        let currentVocab = VOCAB_DATA;
        let gameMode = 'easy'; 
        let level = 1;
        let score = 0;
        let timeLeft = 0;
        let highScore = parseInt(localStorage.getItem('cet6_high_score')) || 0;
        let gameOver = false, isWinAll = false, firstSelected = null, timerInterval = null;
        let currentCards = [];
        let isAnimating = false;
        let wrongWords = {}; // 错题本 { "en_word": { en, cn, count } }

        const board = document.getElementById('game-board');
        const levelLabel = document.getElementById('level-label');
        const scoreLabel = document.getElementById('score-label');
        const highScoreLabel = document.getElementById('high-score-label');
        const timeLabel = document.getElementById('time-label');
        const promptLabel = document.getElementById('prompt-label');
        
        const startMenu = document.getElementById('start-menu');
        const endScreen = document.getElementById('end-screen');
        const wrongListScreen = document.getElementById('wrong-list-screen');

        highScoreLabel.innerText = `最高: ${highScore}`;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function startGame(mode) {
            gameMode = mode;
            startMenu.style.display = 'none';
            endScreen.style.display = 'none';
            wrongListScreen.style.display = 'none';
            level = 1;
            score = 0;
            wrongWords = {}; // 清空错题本
            startLevel();
        }

        function giveUp() {
            clearInterval(timerInterval);
            gameOver = true;
            showEndScreen();
        }

        function goHome() {
            clearInterval(timerInterval);
            startMenu.style.display = 'flex';
            endScreen.style.display = 'none';
            wrongListScreen.style.display = 'none';
            board.innerHTML = '';
        }

        function showEndScreen() {
            document.getElementById('end-score').innerText = score;
            endScreen.style.display = 'flex';
        }

        function showWrongList() {
            endScreen.style.display = 'none';
            wrongListScreen.style.display = 'flex';
            
            const container = document.getElementById('wrong-list-container');
            container.innerHTML = '';
            
            const keys = Object.keys(wrongWords);
            if (keys.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px;">太棒了！本局没有选错任何单词！</div>';
                return;
            }

            // 按错误次数降序排列
            const sortedWords = keys.map(k => wrongWords[k]).sort((a, b) => b.count - a.count);

            sortedWords.forEach(w => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `
                    <div>
                        <div class="wrong-item-en">${w.en}</div>
                        <div class="wrong-item-cn">${w.cn}</div>
                    </div>
                    <div class="wrong-item-count">错了 ${w.count} 次</div>
                `;
                container.appendChild(div);
            });
        }

        function startLevel() {
            clearInterval(timerInterval);
            if (level > LEVEL_PAIRS.length) {
                gameOver = true; isWinAll = true;
                showEndScreen();
                return;
            }

            const pairsCount = LEVEL_PAIRS[level - 1];
            const totalCards = pairsCount * 2;
            
            timeLeft = pairsCount * 15; 

            gameOver = false; isWinAll = false; firstSelected = null; isAnimating = false;
            updateInfo();

            let maxCols = window.innerWidth < 600 ? 4 : 6;
            let cols = Math.ceil(Math.sqrt(totalCards));
            if (cols > maxCols) cols = maxCols;
            while (totalCards % cols !== 0) { cols--; }
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            generateBoard(pairsCount);
            renderBoard();
            
            timerInterval = setInterval(() => {
                if (gameOver || isWinAll || isAnimating) return;
                timeLeft--;
                timeLabel.innerText = `剩余: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver = true;
                    showEndScreen();
                }
            }, 1000);
        }

        function generateBoard(pairsCount) {
            let fullVocab = currentVocab;
            let third = Math.floor(fullVocab.length / 3);
            let pool = [];

            if (gameMode === 'easy') {
                pool = fullVocab.slice(0, Math.max(third, 6));
            } else if (gameMode === 'hard') {
                pool = fullVocab.slice(third, Math.max(third * 2, 12));
            } else {
                pool = fullVocab.slice(third * 2);
            }

            if (pool.length === 0) pool = fullVocab;
            let safePool = [...pool].sort(() => 0.5 - Math.random());
            while (safePool.length < pairsCount) {
                safePool = safePool.concat([...pool].sort(() => 0.5 - Math.random()));
            }

            currentCards = [];
            for (let i = 0; i < pairsCount; i++) {
                const word = safePool[i];
                const pairId = `pair_${i}`;
                currentCards.push({ 
                    type: 'en', text: word.en, pairId, wordObj: word,
                    color: COLORS_EN[Math.floor(Math.random()*COLORS_EN.length)] 
                });
                currentCards.push({ 
                    type: 'cn', text: word.cn, pairId, wordObj: word,
                    color: COLORS_CN[Math.floor(Math.random()*COLORS_CN.length)] 
                });
            }
            currentCards.sort(() => 0.5 - Math.random());
        }

        function renderBoard() {
            board.innerHTML = '';
            currentCards.forEach((card, index) => {
                if (card.cleared) return;
                const div = document.createElement('div');
                div.className = 'card ' + (card.type === 'en' ? 'card-en' : 'card-cn');
                if (firstSelected === index) div.classList.add('selected');
                if (card.isWrong) div.classList.add('wrong');
                
                div.dataset.index = index;
                // 如果没有被标记为错误，则使用正常颜色
                div.style.backgroundColor = card.isWrong ? '#e74c3c' : card.color;
                
                div.innerText = card.text;
                div.onclick = () => onCardClick(index);
                board.appendChild(div);
            });

            requestAnimationFrame(adjustFontSize);
        }

        function adjustFontSize() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(div => {
                div.style.fontSize = ''; 
                const width = div.offsetWidth;
                if (width === 0) return;

                if (div.classList.contains('card-en')) {
                    let len = div.innerText.length;
                    let size = width / (len * 0.65);
                    size = Math.min(size, width * 0.35);
                    div.style.fontSize = Math.max(size, 12) + 'px';
                } else {
                    div.style.fontSize = (width * 0.22) + 'px';
                }
            });
        }

        window.addEventListener('resize', adjustFontSize);

        function onCardClick(index) {
            if (gameOver || isWinAll || isAnimating || currentCards[index].cleared) return;

            if (firstSelected === null) {
                firstSelected = index; renderBoard(); return;
            }
            if (firstSelected === index) {
                firstSelected = null; renderBoard(); return;
            }

            const card1 = currentCards[firstSelected], card2 = currentCards[index];

            if (card1.type === card2.type || card1.pairId !== card2.pairId) {
                // --- 选错处理 ---
                playSound('error');
                score -= 3; 
                updateInfo();

                // 记录错词
                recordWrong(card1);
                recordWrong(card2);

                // 视觉反馈
                isAnimating = true;
                card1.isWrong = true;
                card2.isWrong = true;
                renderBoard();

                setTimeout(() => {
                    card1.isWrong = false;
                    card2.isWrong = false;
                    isAnimating = false;
                    firstSelected = null;
                    renderBoard();
                }, 600);
                return;
            }

            // --- 选对处理 ---
            playSound('success');
            card1.cleared = true; card2.cleared = true;
            score += 5; firstSelected = null; updateInfo(); renderBoard();

            if (currentCards.every(c => c.cleared)) {
                gameOver = true; clearInterval(timerInterval);
                setTimeout(() => { level++; startLevel(); }, 1000);
            }
        }

        function recordWrong(card) {
            const w = card.wordObj;
            if (!w) return;
            if (!wrongWords[w.en]) {
                wrongWords[w.en] = { en: w.en, cn: w.cn, count: 0 };
            }
            wrongWords[w.en].count++;
        }

        function updateInfo() {
            levelLabel.innerText = `第 ${level} 关 (${LEVEL_PAIRS[level-1] || 0}对)`;
            scoreLabel.innerText = `总分: ${score}`;
            timeLabel.innerText = `剩余: ${timeLeft}s`;
            
            if (score > highScore) {
                highScore = score; localStorage.setItem('cet6_high_score', highScore);
                highScoreLabel.innerText = `最高: ${highScore}`;
                promptLabel.innerText = "goodo(￣▽￣)d，你太棒了"; promptLabel.style.color = "#f1c40f";
            } else if (highScore > 0 && score >= highScore * 0.5) {
                promptLabel.innerText = "你即将打破历史最高记录"; promptLabel.style.color = "#e74c3c";
            } else if (highScore > 0 && score >= highScore * (1/3)) {
                promptLabel.innerText = "加油"; promptLabel.style.color = "#2ecc71";
            } else { promptLabel.innerText = ""; }
        }
    </script>
