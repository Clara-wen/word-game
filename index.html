<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word-game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1e1e24; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #top-panel { padding: 8px 10px; background-color: #1e1e24; border-bottom: 1px solid #333; flex-shrink: 0; z-index: 10; }
        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .info-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        #level-label { color: #f1c40f; }
        #score-label { color: #fff; }
        #high-score-label { color: #e67e22; }
        #time-label { color: #e74c3c; font-size: 14px;}
        #prompt-label { width: 100%; text-align: center; font-size: 12px; min-height: 16px; color: #aaa; margin-bottom: 5px;}
        
        .tool-row { display: flex; justify-content: space-between; align-items: center; }
        .tool-btn { background-color: #3498db; color: white; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }

        #game-wrapper { flex: 1; overflow-y: auto; padding: 10px; display: flex; justify-content: center; align-items: center;}
        #game-board { display: grid; gap: 6px; width: 100%; max-width: 600px; align-content: center; justify-content: center;}

        .card { 
            display: flex; justify-content: center; align-items: center; text-align: center; 
            border-radius: 10px; cursor: pointer; padding: 4px; 
            transition: transform 0.1s, box-shadow 0.1s; 
            aspect-ratio: 1 / 1; 
            width: 100%; 
            line-height: 1.15; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.95); }
        .card.selected { box-shadow: 0 0 0 4px #fff inset; transform: scale(0.95); }
        .card.cleared { visibility: hidden; pointer-events: none; }
        
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 50% { transform: translateX(5px) rotate(2deg); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .card.wrong { animation: shake 0.4s ease-in-out; background-color: #e74c3c !important; color: #fff !important; border: 2px solid #fff; }
        
        /* 核心修复：英文不强制换行，交给 JS 判断 */
        .card-en { color: #ffffff !important; font-weight: bold; font-family: 'Arial', sans-serif; }
        /* 中文换行 */
        .card-cn { color: #000000 !important; font-weight: bold; white-space: pre-wrap; word-break: break-all; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(30,30,36,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; overflow-y: auto;}
        .menu-title { font-size: 28px; color: #f1c40f; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px rgba(241,196,15,0.5); }
        
        .vocab-slider { display: flex; gap: 10px; width: 100%; max-width: 400px; overflow-x: auto; padding: 10px; margin-bottom: 20px; scroll-snap-type: x mandatory; }
        .vocab-slider::-webkit-scrollbar { display: none; }
        .vocab-item { flex: 0 0 auto; padding: 10px 20px; background-color: #2c3e50; border-radius: 20px; cursor: pointer; scroll-snap-align: center; font-weight: bold; transition: all 0.2s;}
        .vocab-item.active { background-color: #f1c40f; color: #1e1e24; transform: scale(1.05); }

        .menu-btn { width: 80%; max-width: 300px; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; }
        .menu-btn:active { transform: scale(0.95); }
        .btn-easy { background-color: #2ecc71; }
        .btn-hard { background-color: #e67e22; }
        .btn-hell { background-color: #e74c3c; }
        .btn-primary { background-color: #3498db; }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-review { background-color: #9b59b6; }

        .list-container { width: 100%; max-width: 500px; max-height: 65vh; overflow-y: auto; background: #2c3e50; border-radius: 10px; padding: 15px; margin-top: 10px; }
        .list-item { border-bottom: 1px solid #34495e; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .item-en { font-size: 16px; font-weight: bold; color: #fff; white-space: nowrap;}
        .item-cn { font-size: 13px; color: #bdc3c7; white-space: pre-wrap; margin-top: 4px; }
        .item-count { font-size: 14px; color: #e74c3c; font-weight: bold; white-space: nowrap; margin-left: 10px;}
        
        .progress-bar { width: 60px; height: 8px; background: #1e1e24; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

    <div id="start-menu" class="overlay">
        <div class="menu-title">Word-game</div>
        <div style="color:#aaa; font-size:12px; margin-bottom:5px;">← 滑动选择词库 →</div>
        <div class="vocab-slider" id="vocab-slider"></div>
        <button class="menu-btn btn-easy" onclick="startGame('easy')">🍏 简单模式</button>
        <button class="menu-btn btn-hard" onclick="startGame('hard')">🔥 困难模式</button>
        <button class="menu-btn btn-hell" onclick="startGame('hell')">💀 地狱模式</button>
        <button class="menu-btn btn-review" onclick="showWrongBook()">📚 我的错题本 / 复习</button>
    </div>

    <div id="wrong-book-screen" class="overlay" style="display: none; justify-content: flex-start; padding-top: 30px;">
        <div style="width:100%; max-width:500px; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="tool-btn btn-secondary" style="padding:8px 15px;" onclick="goHome()">⬅ 主页</button>
            <div style="font-size: 18px; font-weight:bold; color:#f1c40f;">历史错题本</div>
            <button class="tool-btn btn-easy" style="padding:8px 15px;" onclick="startReview()">开始复习</button>
        </div>
        <div class="list-container" id="wrong-list-container"></div>

    <div id="end-screen" class="overlay" style="display: none;">
        <div class="menu-title" style="color:#fff;">游戏结束</div>
        <div style="font-size: 18px; margin-bottom: 20px;">最终得分: <span id="end-score" style="color:#f1c40f; font-weight:bold; font-size:24px;">0</span></div>
        <button class="menu-btn btn-primary" onclick="showWrongBook()">📖 查看错题本</button>
        <button class="menu-btn btn-secondary" onclick="goHome()">🏠 返回主页</button>
    </div>

    <div id="top-panel">
        <div class="info-row">
            <div class="info-group">
                <span id="level-label">第 1 关</span>
                <span id="score-label">总分: 0</span>
                <span id="high-score-label">最高: 0</span>
            </div>
            <span id="time-label">剩余: 0s</span>
        </div>
        <div id="prompt-label"></div>
        <div class="tool-row">
            <button class="tool-btn" onclick="goHome()">🏠 返回主页</button>
            <button class="tool-btn" onclick="giveUp()">🔄 放弃当前局</button>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="game-board"></div>
    </div>

            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            generateBoard(pairsCount); renderBoard();
            
            timerInterval = setInterval(() => {
                if (gameOver || isWinAll || isAnimating) return;
                timeLeft--; timeLabel.innerText = `剩余: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval); gameOver = true;
                    document.getElementById('end-score').innerText = score;
                    endScreen.style.display = 'flex';
                }
            }, 1000);
        }

        function generateBoard(pairsCount) {
            let sourceVocab = isReviewMode ? Object.values(globalWrongWords) : (VOCAB_DATA[currentVocabKey] || []);
            let fullVocab = sourceVocab;
            
            if (!isReviewMode) {
                let third = Math.floor(fullVocab.length / 3);
                if (gameMode === 'easy') fullVocab = fullVocab.slice(0, Math.max(third, 6));
                else if (gameMode === 'hard') fullVocab = fullVocab.slice(third, Math.max(third * 2, 12));
                else fullVocab = fullVocab.slice(third * 2);
            }
            if (fullVocab.length === 0) fullVocab = sourceVocab;
            
            let safePool = [...fullVocab].sort(() => 0.5 - Math.random());
            while (safePool.length < pairsCount) safePool = safePool.concat([...fullVocab].sort(() => 0.5 - Math.random()));

            currentCards = [];
            for (let i = 0; i < pairsCount; i++) {
                const word = safePool[i], pairId = `pair_${i}`;
                currentCards.push({ type: 'en', text: word.en, pairId, wordObj: word, color: COLORS_EN[Math.floor(Math.random()*COLORS_EN.length)] });
                currentCards.push({ type: 'cn', text: word.cn, pairId, wordObj: word, color: COLORS_CN[Math.floor(Math.random()*COLORS_CN.length)] });
            }
            currentCards.sort(() => 0.5 - Math.random());
        }

        function renderBoard() {
            board.innerHTML = '';
            currentCards.forEach((card, index) => {
                if (card.cleared) return;
                const div = document.createElement('div');
                div.className = 'card ' + (card.type === 'en' ? 'card-en' : 'card-cn');
                if (firstSelected === index) div.classList.add('selected');
                if (card.isWrong) div.classList.add('wrong');
                div.dataset.index = index;
                div.style.backgroundColor = card.isWrong ? '#e74c3c' : card.color;
                div.innerText = card.text;
                div.onclick = () => onCardClick(index);
                board.appendChild(div);
            });
            requestAnimationFrame(adjustFontSize);
        }

        // 【核心修复】根据是否包含空格区分短语与单字，精准设定字号和换行
        function adjustFontSize() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(div => {
                div.style.fontSize = ''; 
                const width = div.offsetWidth;
                if (width === 0) return;

                if (div.classList.contains('card-en')) {
                    let text = div.innerText;
                    if (text.includes(" ")) {
                        // 短语：允许换行，字号稍微小一点
                        div.style.whiteSpace = "normal";
                        div.style.wordBreak = "break-word";
                        div.style.fontSize = Math.max(width * 0.20, 10) + 'px';
                    } else {
                        // 单词：强制单行，自动缩放字号
                        div.style.whiteSpace = "nowrap";
                        let len = text.length;
                        let size = width / (len * 0.65);
                        size = Math.min(size, width * 0.35);
                        div.style.fontSize = Math.max(size, 9) + 'px';
                    }
                } else {
                    div.style.fontSize = (width * 0.22) + 'px';
                }
            });
        }

        window.addEventListener('resize', adjustFontSize);

        function onCardClick(index) {
            if (gameOver || isWinAll || isAnimating || currentCards[index].cleared) return;
            if (firstSelected === null) { firstSelected = index; renderBoard(); return; }
            if (firstSelected === index) { firstSelected = null; renderBoard(); return; }

            const card1 = currentCards[firstSelected], card2 = currentCards[index];
            if (card1.type === card2.type || card1.pairId !== card2.pairId) {
                playSound('error'); score -= 3; updateInfo();
                recordWrong(card1); recordWrong(card2);
                isAnimating = true; card1.isWrong = true; card2.isWrong = true; renderBoard();
                setTimeout(() => {
                    card1.isWrong = false; card2.isWrong = false; isAnimating = false; firstSelected = null; renderBoard();
                }, 600);
                return;
            }

            playSound('success'); card1.cleared = true; card2.cleared = true;
            score += 5; firstSelected = null; updateInfo(); 
            if (isReviewMode) increaseReviewProgress(card1.wordObj.en);
            renderBoard();

            if (currentCards.every(c => c.cleared)) {
                gameOver = true; clearInterval(timerInterval);
                if (isReviewMode) { setTimeout(() => { alert("本轮复习完成！"); showWrongBook(); }, 500); } 
                else { setTimeout(() => { level++; startLevel(); }, 1000); }
            }
        }

        function recordWrong(card) {
            const w = card.wordObj;
            if (!w) return;
            if (!globalWrongWords[w.en]) globalWrongWords[w.en] = { en: w.en, cn: w.cn, count: 0, reviewProgress: 0 };
            globalWrongWords[w.en].count++; saveWrongWords();
        }

        function increaseReviewProgress(en) {
            if (globalWrongWords[en]) {
                if (globalWrongWords[en].reviewProgress === undefined) globalWrongWords[en].reviewProgress = 0;
                globalWrongWords[en].reviewProgress++;
                if (globalWrongWords[en].reviewProgress >= 5) delete globalWrongWords[en];
                saveWrongWords();
            }
        }

        function updateInfo() {
            levelLabel.innerText = isReviewMode ? `复习模式` : `第 ${level} 关 (${LEVEL_PAIRS[level-1] || 0}对)`;
            scoreLabel.innerText = `总分: ${score}`;
            timeLabel.innerText = `剩余: ${timeLeft}s`;
            if (score > highScore) {
                highScore = score; localStorage.setItem('cet6_high_score', highScore);
                highScoreLabel.innerText = `最高: ${highScore}`;
                promptLabel.innerText = "goodo(￣▽￣)d，你太棒了"; promptLabel.style.color = "#f1c40f";
            } else if (highScore > 0 && score >= highScore * 0.5) {
                promptLabel.innerText = "你即将打破历史最高记录"; promptLabel.style.color = "#e74c3c";
            } else if (highScore > 0 && score >= highScore * (1/3)) {
                promptLabel.innerText = "加油"; promptLabel.style.color = "#2ecc71";
            } else { promptLabel.innerText = ""; }
        }
    </script>
